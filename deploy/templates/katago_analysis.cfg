# KataGo analysis engine settings for go_server.py --katago: end-of-game judging (dead
# stones, cleanup moves) for every bot, on the CPU, with a small network. Queries are tiny
# (1 visit for dead stones, ~32 for a cleanup move), so a couple of threads suffice.

logDir = katago_logs
logAllRequests = false
logAllResponses = false
logSearchInfo = false
logToStderr = false

# ownership and score from Black's side (go_server also forces this on the command line)
reportAnalysisWinratesAs = BLACK

# queries in flight at once (several bots finishing together), and threads per query
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 1

# CPU (Eigen) backend
numNNServerThreadsPerModel = 1
numEigenThreadsPerModel = 2
nnMaxBatchSize = 4
nnCacheSizePowerOfTwo = 17
nnMutexPoolSizePowerOfTwo = 14
