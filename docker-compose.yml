services:
  gpu:
    build: .
    volumes:
      - .:/workspace
      # No hardcoded default on purpose - a local path only ever makes sense on the
      # machine it was written for, and this repo may end up somewhere else. Set
      # TRAINING_DATA_DIR in a local .env (gitignored - see .env.example) instead;
      # compose refuses to run with a clear error if it's unset. To read from a
      # different location for one command without touching .env, override the mount
      # directly, e.g.:
      #   docker compose run --rm -v /some/other/path:/data:ro gpu ...
      - ${TRAINING_DATA_DIR:?Set TRAINING_DATA_DIR in .env - see .env.example}:/data
    working_dir: /workspace
    environment:
      # Make failures obvious if GPU passthrough isn't actually wired up, rather than
      # silently falling back to CPU.
      - TF_CPP_MIN_LOG_LEVEL=1
      # Works around an XLA/cuDNN9 autotuner failure on this GPU - see
      # AlphaGo/training/xla_workarounds.py for the full explanation, which is also where
      # this is actually enforced now (belt-and-suspenders: training code sets this itself
      # at module load, so it no longer depends on this env var surviving here).
      - XLA_FLAGS=--xla_gpu_force_conv_nhwc=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
