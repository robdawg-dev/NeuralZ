[project]
name = "rocalphago"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cython>=3.3.0",
    "h5py>=3.11.0,<3.15.0",
    # Pinned rather than left to float with TF's own "keras>=3.12.0": a Keras change can
    # alter training behavior and model loading, so each bump is verified on its own
    # (benchmarks/_capture_policy_reference.py). The trained models were produced with
    # 3.13.2.
    "keras==3.15.1",
    "sgf==0.5",
    "tensorflow==2.21.0",
]

[project.optional-dependencies]
# The Docker image only: TensorFlow's CUDA/cuDNN libraries as pip packages. Linux-only -
# TF has no GPU support on native Windows, where the base CPU build is used.
gpu = [
    "tensorflow[and-cuda]==2.21.0; sys_platform == 'linux'",
]
# plot_network_output (AlphaGo/util.py) and benchmarks/_plot_sgf_heatmaps.py only -
# never imported by the trainer or any play_tests/ script that doesn't visualize.
viz = [
    "matplotlib>=3.10.9",
]
# interface/gtp_wrapper.py only, used by go_client.py - never imported by the
# trainer or play_tests/ (match_networks.py, katago_verify.py, etc. don't speak GTP).
gtp = [
    "pygtp==0.3",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "cython-lint>=0.21.1",
    "flake8>=7.4.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end run_training() tests (XLA compile on CPU); deselect with -m 'not slow'",
]

# Test coverage:
#   coverage run -m pytest tests && coverage combine && coverage report
# Counts worker processes (convert_shuffled, sgf_preparation's parallel scan) and the
# programs tests launch as processes (go_server.py, go_client.py) -
# otherwise their code shows as untested. The Cython engine (*.pyx) isn't measured.
[tool.coverage.run]
source = ["AlphaGo", "interface", "go_server", "go_client"]
omit = ["deprecated/*"]
concurrency = ["multiprocessing", "thread"]
parallel = true
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
sort = "Cover"

[tool.cython-lint]
max-line-length = 100
